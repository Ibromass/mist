<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <meta name="robots" content="noindex,follow">
  <title>Thank You | MIST &amp; BLOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="thank-you.js" defer></script>
</head>
<body class="thank-you-page">
  <header class="site-header thank-you-header">
    <a class="brand text-brand" href="index.html" aria-label="Mist and Bloom home"><span class="brand-aroma">AROMA</span><span class="brand-name">MIST <i>&amp;</i> BLOOM</span></a>
  </header>
  <main class="thank-you-main">
    <section class="thank-you-card" aria-labelledby="thank-you-title">
      <div class="thank-you-mark" aria-hidden="true">&#10003;</div>
      <p class="eyebrow">MIST &amp; BLOOM</p>
      <h1 id="thank-you-title">Thank you!</h1>
      <p class="thank-you-message" id="thank-you-message">Your order request is being confirmed.</p>
      <div class="thank-you-reference" id="thank-you-reference" hidden><span>Order reference</span><strong id="order-reference"></strong></div>
      <p class="thank-you-delivery">Free delivery is included. Our team will contact you to confirm the order and delivery details.</p>
      <a class="button button-dark" href="index.html#packages">Back to the offers <span aria-hidden="true">&#8594;</span></a>
    </section>
    <p class="thank-you-footer">A softer space. More to love.</p>
  </main>
</body>
</html>
